name: bracket-lab

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    userns_mode: "${CONTAINER_USERNS:-host}"
    working_dir: /var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www/html:z

  web:
    image: docker.io/library/nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  node:
    image: docker.io/library/node:24-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    userns_mode: "${CONTAINER_USERNS:-host}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/var/www/html:z
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0
